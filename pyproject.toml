[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerisk-fvlz"
version = "2.2.0"
description = "Reproducible evaluation of safeguarded dispatch policies in the Fuerteventura–Lanzarote power system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aday Carlos Martín Mederos"}]
keywords = ["island power systems", "dispatch", "reserve", "uncertainty"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.scripts]
aerisk-fvlz = "aerisk_fvlz.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
